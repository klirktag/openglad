name: Build Linux bundle

on:
  push:
    branches: [master]
  pull_request:
  # Reusable: can be invoked by a release workflow on merges to master.
  workflow_call:

permissions:
  # write: publish the bundle as a GitHub Release on push to master.
  contents: write

jobs:
  build-linux-bundle:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so `git describe` can name the bundle.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            patchelf \
            libsdl2-dev \
            libsdl2-mixer-dev \
            libpng-dev \
            libphysfs-dev \
            libzip-dev \
            libyaml-dev \
            zlib1g-dev

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: package-linux-bundle

      - name: Configure (dev-release preset)
        run: >
          cmake --preset dev-release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build game binaries
        run: cmake --build --preset dev-release --target openglad openscen -j"$(nproc)"

      - name: Package Linux bundle
        run: ./scripts/package_linux_bundle.sh build/dev-release

      # actions/upload-artifact does not preserve the Unix executable bit, so
      # we zip the bundle ourselves first (zip stores file permissions) and
      # upload the single archive. The +x bit on the binaries then survives
      # the artifact round-trip.
      - name: Archive bundle (preserves executable bit)
        id: bundle
        run: |
          set -euo pipefail
          cd distrib
          dir="$(basename openglad-*-linux-bundle)"
          zip -r -y -q "${dir}.zip" "$dir"
          echo "name=${dir}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload openglad-linux-bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: distrib/openglad-*-linux-bundle.zip
          if-no-files-found: error

      # --- Release (master merges only) ---------------------------------------
      # On a push to master, publish the bundle as a GitHub Release. The tag is
      # the same `git describe` string the packaging script uses, so this and the
      # Windows job attach their archives to one shared release per commit. PR
      # builds skip this and only upload the workflow artifact above.
      - name: Determine release tag
        if: github.event_name == 'push'
        id: relver
        run: echo "tag=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.relver.outputs.tag }}
          name: OpenGlad ${{ steps.relver.outputs.tag }}
          # Automated per-commit build from master, not a curated release.
          prerelease: true
          files: distrib/openglad-*-linux-bundle.zip
          fail_on_unmatched_files: true
